<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/styles/base.css}"/>
    <link rel="stylesheet" th:href="@{/styles/auth.css}"/>
    <link rel="stylesheet" th:href="@{/styles/chat.css}"/>
    <link rel="stylesheet" th:href="@{/styles/profile.css}"/>
    <link rel="stylesheet" th:href="@{/styles/modals.css}"/>
    <link rel="icon" th:href="@{/icons/favicon.ico}" type="image/x-icon">
    <title>Регистрация</title>
</head>
<body>
<div class="login-box">
    <div class="logo">sicelica</div>

    <form id="registrationForm">
        <input id="username"
               class="input"
               type="text"
               placeholder="имя пользователя"
               autocomplete="username"
               required/>

        <input id="password"
               class="input"
               type="password"
               placeholder="пароль"
               autocomplete="new-password"
               required/>

        <input id="passwordConfirmation"
               class="input"
               type="password"
               placeholder="повторите пароль"
               autocomplete="new-password"
               required/>

        <input id="email"
               class="input"
               type="text"
               placeholder="введите почту"
               autocomplete="email"
               required/>

        <button class="btn" id="registerBtn" type="submit">
            Зарегистрироваться
        </button>

        <div class="bottom-links">
            <a th:href="@{/login}">Войти</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('registrationForm')
        .addEventListener('submit', async function (e) {
            e.preventDefault();
            clearError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirmation = document.getElementById('passwordConfirmation').value;
            const email = document.getElementById('email').value.trim();

            if (!username || !password || !passwordConfirmation || !email) {
                showError('Пожалуйста, заполните все поля');
                return;
            }

            if (password !== passwordConfirmation) {
                showError('Пароли не совпадают');
                return;
            }

            if (!isValidEmail(email)) {
                showError('Введите корректный email');
                return;
            }

            const btn = document.getElementById('registerBtn');
            setButtonState(btn, true, 'Отправляем...');

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        passwordConfirmation,
                        email
                    })
                });

                const data = await tryReadJson(response);

                if (!response.ok) {
                    showError(collectErrorMessage(data) || 'Ошибка регистрации');
                    return;
                }

                window.location.href = '/check-email?email=' + encodeURIComponent(email);

            } catch (error) {
                console.error('Ошибка:', error);
                showError('Ошибка сервера. Попробуйте позже.');
            } finally {
                setButtonState(btn, false, 'Зарегистрироваться');
            }
        });

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function setButtonState(button, disabled, text) {
        if (!button) return;
        button.disabled = disabled;
        button.textContent = text;
    }

    async function tryReadJson(response) {
        try {
            return await response.json();
        } catch {
            return null;
        }
    }

    function collectErrorMessage(data) {
        if (!data) return '';

        if (typeof data === 'string') {
            return data;
        }

        if (typeof data.message === 'string' && data.message.trim()) {
            return data.message.trim();
        }

        if (typeof data.error === 'string' && data.error.trim()) {
            return data.error.trim();
        }

        if (Array.isArray(data.errors) && data.errors.length > 0) {
            return data.errors.filter(Boolean).join(', ');
        }

        if (typeof data === 'object') {
            const values = Object.values(data).flat().filter(Boolean);
            if (values.length > 0) {
                return values.join(', ');
            }
        }

        return '';
    }

    function showError(message) {
        let errorDiv = document.getElementById('errorMessage');

        if (!errorDiv) {
            errorDiv = document.createElement('div');
            errorDiv.id = 'errorMessage';
            errorDiv.className = 'error-message';
            document.getElementById('registrationForm').prepend(errorDiv);
        }

        errorDiv.innerHTML = '';

        String(message)
            .split('\n')
            .filter(Boolean)
            .forEach(msg => {
                const line = document.createElement('div');
                line.textContent = `• ${msg}`;
                errorDiv.appendChild(line);
            });

        errorDiv.style.display = 'block';
    }

    function clearError() {
        const errorDiv = document.getElementById('errorMessage');
        if (errorDiv) {
            errorDiv.style.display = 'none';
            errorDiv.innerHTML = '';
        }
    }

    ['username', 'password', 'passwordConfirmation', 'email'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', clearError);
    });
</script>
</body>
</html>
