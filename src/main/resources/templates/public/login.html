<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/styles/style.css}"/>
    <link rel="icon" href="./icons/favicon.ico" type="image/x-icon">
    <title>Вход</title>
</head>
<body>
    <div class="login-box">
        <div class="logo">sicelica</div>

        <form id="loginForm">
            <input id="email" class="input" type="text"
                   placeholder="почта" required/>
            <input id="password" class="input" type="password"
                   placeholder="пароль" required/>

            <div class="row">
                <label>
                    <input type="checkbox" name="remember-me"> Запомнить меня
                </label>
            </div>

            <div id="errorBox" class="errorBox">
                Неверный логин или пароль
            </div>

            <button class="btn" type="submit">Войти</button>
        </form>

        <div class="bottom-links">
            <a th:href="@{/register}">Зарегистрироваться</a>
            <a th:href="@{/passreset}">Забыли пароль?</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('loginForm')
                .addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const email = document.getElementById('email').value;

                    const password   = document.getElementById('password').value;

                    const rememberMe = document.querySelector('input[name="remember-me"]').checked;

                    try {
                        const response = await fetch('/api/v1/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },

                            body: JSON.stringify({ email, password, rememberMe })
                        });

                        if (!response.ok) {
                            document.getElementById('errorBox').style.display = 'block';
                            return;
                        }

                        const data = await response.json();

                        if (data.accessToken) {
                            window.location.href = '/chat';
                        } else {
                            document.getElementById('errorBox').style.display = 'block';
                        }

                    } catch (err) {
                        console.error('Ошибка запроса:', err);
                        document.getElementById('errorBox').style.display = 'block';
                    }
                });

            ['email', 'password'].forEach(id => {
                document.getElementById(id).addEventListener('input', function () {
                    document.getElementById('errorBox').style.display = 'none';
                });
            });
        });
    </script>
</body>
</html>
