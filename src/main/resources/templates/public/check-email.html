<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/styles/base.css}"/>
    <link rel="stylesheet" th:href="@{/styles/auth.css}"/>
    <link rel="stylesheet" th:href="@{/styles/chat.css}"/>
    <link rel="stylesheet" th:href="@{/styles/profile.css}"/>
    <link rel="stylesheet" th:href="@{/styles/modals.css}"/>
    <link rel="icon" th:href="@{/icons/favicon.ico}" type="image/x-icon">
    <title>Подтвердите email</title>
</head>
<body>
<div class="login-box">
    <div class="logo">sicelica</div>

    <div style="text-align: center; padding: 20px;">
        <h2>Письмо отправлено!</h2>
        <p id="emailText">
            Проверьте вашу почту и перейдите по ссылке для подтверждения аккаунта.
        </p>
        <p style="color: #888; font-size: 14px;">Ссылка действительна 24 часа.</p>
    </div>

    <div class="bottom-links">
        <a th:href="@{/login}">Вернуться на страницу входа</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    const emailText = document.getElementById('emailText');

    if (email && emailText) {
        emailText.textContent =
            `Письмо отправлено на ${email}. Перейдите по ссылке для подтверждения аккаунта.`;
    }
</script>
</body>
</html>
