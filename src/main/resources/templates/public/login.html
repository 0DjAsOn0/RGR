<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/styles/base.css}"/>
    <link rel="stylesheet" th:href="@{/styles/auth.css}"/>
    <link rel="stylesheet" th:href="@{/styles/chat.css}"/>
    <link rel="stylesheet" th:href="@{/styles/profile.css}"/>
    <link rel="stylesheet" th:href="@{/styles/modals.css}"/>
    <link rel="icon" th:href="@{/icons/favicon.ico}" type="image/x-icon">
    <title data-i18n="title">Вход</title>
</head>
<body>

<div style="position: absolute; top: 15px; right: 20px;">
    <select id="langSelect" style="background: transparent; color: #888; border: none; cursor: pointer; outline: none; font-size: 14px;">
        <option value="ru">RU</option>
        <option value="en">EN</option>
    </select>
</div>

<div class="login-box">
    <div class="logo">sicelica</div>

    <form id="loginForm">
        <input id="email"
               class="input"
               type="text"
               data-i18n="email.placeholder"
               placeholder="почта"
               autocomplete="email"
               required/>

        <input id="password"
               class="input"
               type="password"
               data-i18n="password.placeholder"
               placeholder="пароль"
               autocomplete="current-password"
               required/>

        <div class="row">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" name="remember-me">
                <span data-i18n="rememberMe">Запомнить меня</span>
            </label>
        </div>

        <div id="errorBox" class="errorBox" style="display:none;"></div>

        <button class="btn" type="submit" data-i18n="btn.login">Войти</button>
    </form>

    <div class="bottom-links">
        <a th:href="@{/register}" data-i18n="link.register">Зарегистрироваться</a>
        <a th:href="@{/passreset}" data-i18n="link.forgot">Забыли пароль?</a>
    </div>
</div>

<script>

    // ЛОКАЛИЗАЦИЯ (i18n)
    const translations = {
        ru: {
            "title": "Вход",
            "email.placeholder": "почта",
            "password.placeholder": "пароль",
            "rememberMe": "Запомнить меня",
            "btn.login": "Войти",
            "link.register": "Зарегистрироваться",
            "link.forgot": "Забыли пароль?",
            "error.default": "Неверный логин или пароль",
            "error.network": "Не удалось выполнить вход. Попробуйте ещё раз."
        },
        en: {
            "title": "Login",
            "email.placeholder": "email",
            "password.placeholder": "password",
            "rememberMe": "Remember me",
            "btn.login": "Log in",
            "link.register": "Register",
            "link.forgot": "Forgot password?",
            "error.default": "Invalid login or password",
            "error.network": "Login failed. Please try again."
        }
    };

    let currentLang = localStorage.getItem('app_lang') || 'ru';
    let t = translations[currentLang];

    function applyTranslations() {
        t = translations[currentLang];
        document.documentElement.lang = currentLang;

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (!t[key]) return;

            if (el.tagName === 'INPUT') {
                el.placeholder = t[key];
            } else if (el.tagName === 'TITLE') {
                document.title = t[key];
            } else {
                el.textContent = t[key];
            }
        });
    }



    // функция вывода ошибок пользователю (она вычленяет понятный текст ошибки и выводит)
    function collectErrorMessage(data) {
        if (!data) return '';
        if (typeof data === 'string') return data;
        if (typeof data.message === 'string' && data.message.trim()) return data.message.trim();
        if (typeof data.error === 'string' && data.error.trim()) return data.error.trim();
        if (Array.isArray(data.errors) && data.errors.length > 0) return data.errors.join(', ');
        return '';
    }

    //ожидает полной загрузки структуры HTML (DOM-дерева), после чего запускает код
    document.addEventListener('DOMContentLoaded', function () {

        // переключение языка
        applyTranslations();

        const langSelect = document.getElementById('langSelect');
        if (langSelect) {
            langSelect.value = currentLang;
            langSelect.addEventListener('change', (e) => {
                currentLang = e.target.value;
                localStorage.setItem('app_lang', currentLang);
                applyTranslations();

                // если ошибка то, переводим и её
                if (errorBox.style.display === 'block' && errorBox.dataset.isDefaultError === 'true') {
                    errorBox.textContent = t["error.default"];
                }
            });
        }

        const loginForm = document.getElementById('loginForm');
        const errorBox = document.getElementById('errorBox');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // функция отправки формы
        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault(); //отключение перезагрузки страницы

            errorBox.style.display = 'none';
            errorBox.textContent = t["error.default"];
            errorBox.dataset.isDefaultError = 'true';

            //данные которые ввел пользователь
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const rememberMe = document.querySelector('input[name="remember-me"]').checked;

            try {
                //отправляем данные пользователя
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept-Language': currentLang
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password, rememberMe })
                });

                if (!response.ok) {
                    let message = t["error.default"];

                    try {
                        const data = await response.json();
                        const serverMessage = collectErrorMessage(data);
                        if (serverMessage) {
                            message = serverMessage;
                            errorBox.dataset.isDefaultError = 'false'; // Сервер прислал свою ошибку
                        }
                    } catch {
                        // ignore
                    }

                    errorBox.textContent = message;
                    errorBox.style.display = 'block';
                    return;
                }
                // переходим к чату
                window.location.href = '/chat';

            } catch (err) {
                console.error('Ошибка запроса:', err);
                errorBox.textContent = t["error.network"];
                errorBox.dataset.isDefaultError = 'false';
                errorBox.style.display = 'block';
            }
        });
        //скрываем ошибку когда пользователь вводит заново почту или пароль
        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('input', function () {
                errorBox.style.display = 'none';
            });
        });
    });
</script>
</body>
</html>
