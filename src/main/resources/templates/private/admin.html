<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="admin.title">Админ-панель</title>

    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
<div class="admin-page">
    <header class="admin-header">
        <div>
            <h1 data-i18n="admin.header">Админ-панель</h1>
            <p class="subtitle" data-i18n="admin.subtitle">Управление пользователями и статистика</p>
        </div>

        <div class="header-actions">
            <a class="back-btn" href="/chat" data-i18n="admin.backToChat">← Назад в чат</a>
        </div>
    </header>

    <section class="stats-section">
        <div class="stat-card">
            <div class="stat-title" data-i18n="admin.statUsers">Пользователей зарегистрировано</div>
            <div class="stat-value" id="totalUsers">—</div>
        </div>

        <div class="stat-card">
            <div class="stat-title" data-i18n="admin.statMessages">Сообщений отправлено</div>
            <div class="stat-value" id="totalMessages">—</div>
        </div>
    </section>

    <section class="users-section">
        <div class="section-header">
            <h2 data-i18n="admin.usersList">Пользователи</h2>
            <button id="refreshBtn" class="refresh-btn" type="button" data-i18n="admin.refreshBtn">Обновить</button>
        </div>

        <div id="adminError" class="admin-error" style="display:none;"></div>

        <div class="table-wrap">
            <table class="users-table">
                <thead>
                <tr>
                    <th data-i18n="admin.thId">ID</th>
                    <th data-i18n="admin.thName">Имя</th>
                    <th data-i18n="admin.thEmail">Email</th>
                    <th data-i18n="admin.thStatus">Статус</th>
                    <th data-i18n="admin.thRoles">Роли</th>
                    <th data-i18n="admin.thBlock">Блокировка</th>
                    <th data-i18n="admin.thActions">Действия</th>
                </tr>
                </thead>
                <tbody id="usersTableBody">
                <tr>
                    <td colspan="7" class="loading-row" data-i18n="app.loading">Загрузка...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<script type="module" src="/js/admin.js"></script>
</body>
</html>
