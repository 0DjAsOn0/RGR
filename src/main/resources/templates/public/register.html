<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/styles/base.css}"/>
    <link rel="stylesheet" th:href="@{/styles/auth.css}"/>
    <link rel="stylesheet" th:href="@{/styles/chat.css}"/>
    <link rel="stylesheet" th:href="@{/styles/profile.css}"/>
    <link rel="stylesheet" th:href="@{/styles/modals.css}"/>
    <link rel="icon" th:href="@{/icons/favicon.ico}" type="image/x-icon">
    <title data-i18n="title">Регистрация</title>
</head>
<body>
<div style="position: absolute; top: 15px; right: 20px;">
    <select id="langSelect" style="background: transparent; color: #888; border: none; cursor: pointer; outline: none; font-size: 14px;">
        <option value="ru">RU</option>
        <option value="en">EN</option>
    </select>
</div>

<div class="login-box">
    <div class="logo">sicelica</div>

    <form id="registrationForm">
        <input id="username"
               class="input"
               type="text"
               data-i18n="username.placeholder"
               placeholder="имя пользователя"
               autocomplete="username"
               required/>

        <input id="password"
               class="input"
               type="password"
               data-i18n="password.placeholder"
               placeholder="пароль"
               autocomplete="new-password"
               required/>

        <input id="passwordConfirmation"
               class="input"
               type="password"
               data-i18n="passConfirm.placeholder"
               placeholder="повторите пароль"
               autocomplete="new-password"
               required/>

        <input id="email"
               class="input"
               type="text"
               data-i18n="email.placeholder"
               placeholder="введите почту"
               autocomplete="email"
               required/>

        <button class="btn" id="registerBtn" type="submit" data-i18n="btn.register">
            Зарегистрироваться
        </button>

        <div class="bottom-links">
            <a th:href="@{/login}" data-i18n="link.login">Войти</a>
        </div>
    </form>
</div>

<script>
    // ========================
    // ЛОКАЛИЗАЦИЯ (i18n)
    // ========================
    const translations = {
        ru: {
            "title": "Регистрация",
            "username.placeholder": "имя пользователя",
            "password.placeholder": "пароль",
            "passConfirm.placeholder": "повторите пароль",
            "email.placeholder": "введите почту",
            "btn.register": "Зарегистрироваться",
            "link.login": "Войти",


            // Тексты для JS
            "js.errFillFields": "Пожалуйста, заполните все поля",
            "js.errPassMatch": "Пароли не совпадают",
            "js.errValidEmail": "Введите корректный email",
            "js.btnSending": "Отправляем...",
            "js.errRegister": "Ошибка регистрации",
            "js.errServer": "Ошибка сервера. Попробуйте позже.",
            "js.errPassCyrillic": "Пароль не должен содержать русские буквы"
        },
        en: {
            "title": "Registration",
            "username.placeholder": "username",
            "password.placeholder": "password",
            "passConfirm.placeholder": "confirm password",
            "email.placeholder": "enter email",
            "btn.register": "Register",
            "link.login": "Login",

            // JS Texts
            "js.errFillFields": "Please fill in all fields",
            "js.errPassMatch": "Passwords do not match",
            "js.errValidEmail": "Enter a valid email",
            "js.btnSending": "Sending...",
            "js.errRegister": "Registration error",
            "js.errServer": "Server error. Please try again later.",
            "js.errPassCyrillic": "Password must not contain Russian letters"
        }
    };

    let currentLang = localStorage.getItem('app_lang') || 'ru';
    let t = translations[currentLang];

    function applyTranslations() {
        t = translations[currentLang];
        document.documentElement.lang = currentLang;

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (!t[key]) return;

            if (el.tagName === 'INPUT') {
                el.placeholder = t[key];
            } else if (el.tagName === 'TITLE') {
                document.title = t[key];
            } else {
                el.textContent = t[key];
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        applyTranslations();

        const langSelect = document.getElementById('langSelect');
        if (langSelect) {
            langSelect.value = currentLang;
            langSelect.addEventListener('change', (e) => {
                currentLang = e.target.value;
                localStorage.setItem('app_lang', currentLang);
                applyTranslations();
                clearError(); // Скрываем ошибки при смене языка
            });
        }
    });

    // ========================
    // ОСНОВНАЯ ЛОГИКА
    // ========================
    document.getElementById('registrationForm')
        .addEventListener('submit', async function (e) {
            e.preventDefault();
            clearError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirmation = document.getElementById('passwordConfirmation').value;
            const email = document.getElementById('email').value.trim();

            if (!username || !password || !passwordConfirmation || !email) {
                showError(t["js.errFillFields"]);
                return;
            }

            if (password !== passwordConfirmation) {
                showError(t["js.errPassMatch"]);
                return;
            }

            if (/[А-Яа-яЁё]/.test(password)) {
                showError(t["js.errPassCyrillic"]);
                return;
            }

            if (!isValidEmail(email)) {
                showError(t["js.errValidEmail"]);
                return;
            }

            const btn = document.getElementById('registerBtn');
            setButtonState(btn, true, t["js.btnSending"]);

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept-Language': currentLang
                    },
                    body: JSON.stringify({
                        username,
                        password,
                        passwordConfirmation,
                        email
                    })
                });

                const data = await tryReadJson(response);

                if (!response.ok) {
                    showError(collectErrorMessage(data) || t["js.errRegister"]);
                    return;
                }

                window.location.href = '/check-email?email=' + encodeURIComponent(email);

            } catch (error) {
                console.error('Ошибка:', error);
                showError(t["js.errServer"]);
            } finally {
                setButtonState(btn, false, t["btn.register"]);
            }
        });

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function setButtonState(button, disabled, text) {
        if (!button) return;
        button.disabled = disabled;
        button.textContent = text;
    }

    async function tryReadJson(response) {
        try {
            return await response.json();
        } catch {
            return null;
        }
    }

    function collectErrorMessage(data) {
        if (!data) return '';

        if (typeof data === 'string') {
            return data;
        }

        if (typeof data.message === 'string' && data.message.trim()) {
            return data.message.trim();
        }

        if (typeof data.error === 'string' && data.error.trim()) {
            return data.error.trim();
        }

        if (Array.isArray(data.errors) && data.errors.length > 0) {
            return data.errors.filter(Boolean).join(', ');
        }

        if (typeof data === 'object') {
            const values = Object.values(data).flat().filter(Boolean);
            if (values.length > 0) {
                return values.join(', ');
            }
        }

        return '';
    }

    function showError(message) {
        let errorDiv = document.getElementById('errorMessage');

        if (!errorDiv) {
            errorDiv = document.createElement('div');
            errorDiv.id = 'errorMessage';
            errorDiv.className = 'error-message';
            document.getElementById('registrationForm').prepend(errorDiv);
        }

        errorDiv.innerHTML = '';

        String(message)
            .split('\n')
            .filter(Boolean)
            .forEach(msg => {
                const line = document.createElement('div');
                line.textContent = `• ${msg}`;
                errorDiv.appendChild(line);
            });

        errorDiv.style.display = 'block';
    }

    function clearError() {
        const errorDiv = document.getElementById('errorMessage');
        if (errorDiv) {
            errorDiv.style.display = 'none';
            errorDiv.innerHTML = '';
        }
    }

    ['username', 'password', 'passwordConfirmation', 'email'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', clearError);
    });
</script>
</body>
</html>
