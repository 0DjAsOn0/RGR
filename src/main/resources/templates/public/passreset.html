<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/styles/base.css}"/>
    <link rel="stylesheet" th:href="@{/styles/auth.css}"/>
    <link rel="stylesheet" th:href="@{/styles/chat.css}"/>
    <link rel="stylesheet" th:href="@{/styles/profile.css}"/>
    <link rel="stylesheet" th:href="@{/styles/modals.css}"/>
    <link rel="icon" th:href="@{/icons/favicon.ico}" type="image/x-icon">
    <title>Сброс пароля</title>
</head>
<body>
<div class="login-box">
    <div class="logo">sicelica</div>

    <!-- ШАГ 1: Ввод email -->
    <div id="stepEmail">
        <p class="step-hint">Введите email, указанный при регистрации</p>
        <form id="emailForm">
            <input id="email"
                   class="input"
                   type="text"
                   placeholder="введите почту"
                   autocomplete="email"
                   required/>

            <button class="btn" id="sendCodeBtn" type="submit">
                Отправить код
            </button>

            <div class="bottom-links">
                <a th:href="@{/login}">Войти</a>
                <a th:href="@{/register}">Регистрация</a>
            </div>
        </form>
    </div>

    <!-- ШАГ 2: Ввод кода -->
    <div id="stepCode" style="display: none;">
        <p class="step-hint">Введите код из письма</p>
        <form id="codeForm">
            <input id="code"
                   class="input"
                   type="text"
                   placeholder="код подтверждения"
                   autocomplete="one-time-code"
                   required/>

            <button class="btn" id="verifyCodeBtn" type="submit">
                Подтвердить
            </button>

            <div class="bottom-links">
                <a href="#" id="resendCode">Отправить повторно</a>
            </div>
        </form>
    </div>

    <!-- ШАГ 3: Новый пароль -->
    <div id="stepNewPassword" style="display: none;">
        <p class="step-hint">Введите новый пароль</p>
        <form id="newPasswordForm">
            <input id="newPassword"
                   class="input"
                   type="password"
                   placeholder="новый пароль"
                   autocomplete="new-password"
                   required/>

            <input id="newPasswordConfirmation"
                   class="input"
                   type="password"
                   placeholder="повторите пароль"
                   autocomplete="new-password"
                   required/>

            <button class="btn" id="resetBtn" type="submit">
                Сменить пароль
            </button>
        </form>
    </div>
</div>

<script>
    let userEmail = '';
    let resendCooldownTimer = null;

    document.getElementById('emailForm')
        .addEventListener('submit', async function (e) {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById('email').value.trim();

            if (!email) {
                showError('Введите email');
                return;
            }

            if (!isValidEmail(email)) {
                showError('Введите корректный email');
                return;
            }

            const btn = document.getElementById('sendCodeBtn');
            setButtonState(btn, true, 'Отправляем...');

            try {
                const response = await fetch('/api/v1/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await tryReadJson(response);

                if (!response.ok) {
                    showError(collectErrorMessage(data) || 'Ошибка отправки кода');
                    return;
                }

                userEmail = email;
                document.getElementById('code').value = '';
                switchStep('stepCode');

            } catch (error) {
                console.error('Ошибка:', error);
                showError('Ошибка сервера. Попробуйте позже.');
            } finally {
                setButtonState(btn, false, 'Отправить код');
            }
        });

    document.getElementById('codeForm')
        .addEventListener('submit', async function (e) {
            e.preventDefault();
            clearMessages();

            const code = document.getElementById('code').value.trim();

            if (!code) {
                showError('Введите код из письма');
                return;
            }

            const btn = document.getElementById('verifyCodeBtn');
            setButtonState(btn, true, 'Проверяем...');

            try {
                const response = await fetch('/api/v1/auth/verify-reset-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, code })
                });

                const data = await tryReadJson(response);

                if (!response.ok) {
                    showError(collectErrorMessage(data) || 'Неверный или истёкший код');
                    return;
                }

                document.getElementById('newPassword').value = '';
                document.getElementById('newPasswordConfirmation').value = '';
                switchStep('stepNewPassword');

            } catch (error) {
                console.error('Ошибка:', error);
                showError('Ошибка сервера. Попробуйте позже.');
            } finally {
                setButtonState(btn, false, 'Подтвердить');
            }
        });

    document.getElementById('newPasswordForm')
        .addEventListener('submit', async function (e) {
            e.preventDefault();
            clearMessages();

            const newPassword = document.getElementById('newPassword').value;
            const newPasswordConfirmation = document.getElementById('newPasswordConfirmation').value;

            if (!newPassword || !newPasswordConfirmation) {
                showError('Заполните все поля');
                return;
            }

            if (newPassword !== newPasswordConfirmation) {
                showError('Пароли не совпадают');
                return;
            }

            if (newPassword.length < 6) {
                showError('Пароль должен быть не менее 6 символов');
                return;
            }

            const btn = document.getElementById('resetBtn');
            setButtonState(btn, true, 'Сохраняем...');

            try {
                const response = await fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: userEmail,
                        newPassword,
                        newPasswordConfirmation
                    })
                });

                const data = await tryReadJson(response);

                if (!response.ok) {
                    showError(collectErrorMessage(data) || 'Ошибка смены пароля');
                    return;
                }

                window.location.href = '/login?passwordReset=true';

            } catch (error) {
                console.error('Ошибка:', error);
                showError('Ошибка сервера. Попробуйте позже.');
            } finally {
                setButtonState(btn, false, 'Сменить пароль');
            }
        });

    document.getElementById('resendCode')
        .addEventListener('click', async function (e) {
            e.preventDefault();
            clearMessages();

            if (!userEmail) {
                showError('Сначала укажите email');
                switchStep('stepEmail');
                return;
            }

            if (this.dataset.locked === 'true') {
                return;
            }

            this.dataset.locked = 'true';
            this.style.pointerEvents = 'none';
            this.textContent = 'Отправляем...';

            try {
                const response = await fetch('/api/v1/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });

                const data = await tryReadJson(response);

                if (response.ok) {
                    showSuccess('Код отправлен повторно');
                    startResendCooldown(this, 30);
                } else {
                    this.dataset.locked = 'false';
                    this.style.pointerEvents = 'auto';
                    this.textContent = 'Отправить повторно';
                    showError(collectErrorMessage(data) || 'Не удалось отправить код');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                this.dataset.locked = 'false';
                this.style.pointerEvents = 'auto';
                this.textContent = 'Отправить повторно';
                showError('Ошибка сервера');
            }
        });

    function switchStep(stepId) {
        clearMessages();

        ['stepEmail', 'stepCode', 'stepNewPassword'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = id === stepId ? 'block' : 'none';
            }
        });
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function setButtonState(button, disabled, text) {
        if (!button) return;
        button.disabled = disabled;
        button.textContent = text;
    }

    async function tryReadJson(response) {
        try {
            return await response.json();
        } catch {
            return null;
        }
    }

    function collectErrorMessage(data) {
        if (!data) return '';
        if (typeof data === 'string') return data;
        if (typeof data.message === 'string' && data.message.trim()) return data.message.trim();
        if (typeof data.error === 'string' && data.error.trim()) return data.error.trim();
        if (Array.isArray(data.errors) && data.errors.length > 0) return data.errors.join(', ');
        return '';
    }

    function showError(message) {
        const errorDiv = getOrCreateMessageDiv('errorMessage', 'error-message');
        errorDiv.innerHTML = '';

        String(message)
            .split('\n')
            .filter(Boolean)
            .forEach(msg => {
                const line = document.createElement('div');
                line.textContent = `• ${msg}`;
                errorDiv.appendChild(line);
            });

        errorDiv.style.display = 'block';
    }

    function showSuccess(message) {
        const successDiv = getOrCreateMessageDiv('successMessage', 'success-message');
        successDiv.textContent = message;
        successDiv.style.display = 'block';

        setTimeout(() => {
            successDiv.style.display = 'none';
        }, 3000);
    }

    function clearMessages() {
        const err = document.getElementById('errorMessage');
        if (err) {
            err.style.display = 'none';
            err.innerHTML = '';
        }

        const suc = document.getElementById('successMessage');
        if (suc) {
            suc.style.display = 'none';
            suc.textContent = '';
        }
    }

    function getOrCreateMessageDiv(id, className) {
        let div = document.getElementById(id);
        if (!div) {
            div = document.createElement('div');
            div.id = id;
            div.className = className;
            document.querySelector('.login-box').prepend(div);
        }
        return div;
    }

    function startResendCooldown(link, seconds) {
        if (resendCooldownTimer) {
            clearInterval(resendCooldownTimer);
            resendCooldownTimer = null;
        }

        let remaining = seconds;

        link.dataset.locked = 'true';
        link.style.pointerEvents = 'none';
        link.textContent = `Повторно через ${remaining}с`;

        resendCooldownTimer = setInterval(() => {
            remaining--;

            if (remaining <= 0) {
                clearInterval(resendCooldownTimer);
                resendCooldownTimer = null;
                link.dataset.locked = 'false';
                link.style.pointerEvents = 'auto';
                link.textContent = 'Отправить повторно';
                return;
            }

            link.textContent = `Повторно через ${remaining}с`;
        }, 1000);
    }
</script>
</body>
</html>
