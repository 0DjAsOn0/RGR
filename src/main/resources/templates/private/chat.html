<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/styles/style.css}"/>
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
    <title>Мессенджер</title>
</head>
<body>
<div class="chat-container">
    <div class="nav-elements">
        <div class="nav-icons">
            <button class="profile-button" id="profileBtn">
                <img class="avatar-img" th:src="@{/avatars/avatar.png}" alt="аватар">
                <span class="base-inscription">Профиль</span>
            </button>
            <button class="chat-button" id="chatBtn">
                <img th:src="@{/icons/add-chat.svg}" alt="создать чат">
                <span class="base-inscription">Создать чат</span>
            </button>
        </div>
        <div class="settings-block">
<!--            <button class="settings-button" id="settingsBtn">-->
<!--                <img class="settings-icon"-->
<!--                     th:src="@{/icons/settings-icon.svg}"-->
<!--                     alt="настройки">-->
<!--            </button>-->
            <button class="logout-button" id="logoutBtn">
                <img class="logout-icon"
                     th:src="@{/icons/logout.svg}"
                     alt="выход">
            </button>
        </div>
    </div>

    <div class="chats-list">
        <div class="search-form">
            <input class="search-form-txt" type="text"
                   placeholder="Поиск" id="searchInput" autocomplete="off">
        </div>
        <ul class="search-results" id="searchResults" style="display:none;"></ul>
        <ul class="chats" id="chatsContainer"></ul>
    </div>

    <div class="resizer"></div>

    <div class="main-dialog empty-dialog" id="mainDialog">
        <p class="main-dialog-inscription">
            Выберите, кому хотели бы написать
        </p>
    </div>
</div>

<!-- Модальное окно создания группы -->
<div class="modal-overlay" id="createGroupModal" style="display:none;">
    <div class="modal">
        <div class="modal-header">
            <span>Создать группу</span>
            <button class="modal-close" id="closeGroupModal">✕</button>
        </div>

        <div class="modal-body">
            <input class="input" type="text"
                   id="groupName" placeholder="Название группы"/>
            <input class="input" type="text"
                   id="groupMemberSearch" placeholder="Добавить участников"/>
            <ul class="group-search-results" id="groupSearchResults"></ul>
            <div class="selected-members" id="selectedMembers"></div>
        </div>

        <div class="modal-footer">
            <button class="btn" id="createGroupBtn">Создать</button>
        </div>
    </div>
</div>

<div id="createWindow" class="profilePage" style="display: none;"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
