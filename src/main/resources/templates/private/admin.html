<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>

    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
<div class="admin-page">
    <header class="admin-header">
        <div>
            <h1>Админ-панель</h1>
            <p class="subtitle">Управление пользователями и статистика</p>
        </div>

        <div class="header-actions">
            <a class="back-btn" href="/chat">← Назад в чат</a>
        </div>
    </header>

    <section class="stats-section">
        <div class="stat-card">
            <div class="stat-title">Пользователей зарегистрировано</div>
            <div class="stat-value" id="totalUsers">—</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Сообщений отправлено</div>
            <div class="stat-value" id="totalMessages">—</div>
        </div>
    </section>

    <section class="users-section">
        <div class="section-header">
            <h2>Пользователи</h2>
            <button id="refreshBtn" class="refresh-btn" type="button">Обновить</button>
        </div>

        <div id="adminError" class="admin-error" style="display:none;"></div>

        <div class="table-wrap">
            <table class="users-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Email</th>
                    <th>Статус</th>
                    <th>Роли</th>
                    <th>Блокировка</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody id="usersTableBody">
                <tr>
                    <td colspan="7" class="loading-row">Загрузка...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<script type="module" src="/js/admin.js"></script>
</body>
</html>
